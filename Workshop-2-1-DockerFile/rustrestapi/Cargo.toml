[package]
name = "axum_rest_api"
version = "0.1.0"
edition = "2021"

description = "High-performance Rust REST API with Axum, MariaDB, and Redis"
license = "MIT"

[dependencies]
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.22.3", features = ["tokio-comp"] }
sqlx = { version = "0.6", features = ["mysql", "runtime-tokio-rustls"] }